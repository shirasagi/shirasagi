# Fuseki Server

production: &production
  options_limit: 100

  # Upload limit size (Bytes)
  # 104857600 = 100MB(1024*1024*100)
  bulk_download_max_filesize: 104857600

  preview:
    map:
      latitude_header:
        - 緯度
        - 北緯
        - 緯度(北緯)
        - 緯度（北緯）
      longitude_header:
        - 経度
        - 東経
        - 経度(東経)
        - 経度（東経）
      name_header:
        - 名称
        - 施設
        - 施設名
        - 設備
        - 設備名
        - 地区
        - 地区名
        - スポット
        - スポット名
    pdf:
      page_limit: 3
      parse_command: "timeout 20 ruby bin/extract_pdf_base64.rb"

  assoc_job:
    # realtime: execute association job when after generate files. this is the default value.
    # skip: not execute association job when after generate files. execute that job on a daily task only.
    mode: realtime
    perform: later

  harvest:
    importer_api:
      - ckan
      - shirasagi_api
      #- shirasagi_scraper
    docker_ckan_api_key: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJqdGkiOiJBQVNLX19lQUMwQ3dxV0VjNXZKcW9hQy1zbWt1dExaU0NORWotMzlYZVZBIiwiaWF0IjoxNjg5ODM1ODMyfQ.rWZGXCfSVDN9jISBcJ8qlyVq_bMKKPOokKdUOe65LJ4

  # SPARQL Endpoint
  fuseki:
    disable: true
    host: 127.0.0.1
    port: 3030
    dataset: opendata

  history:
    save_days: 14

  #
  # resource crawling
  #

  # タイムアウト秒数
  # request_timeout: 30

  # 最大ダウンロードサイズ（単位: バイト）
  # max_download_size: 10485760

  # 最大リダイレクト回数
  # max_redirection: 3

  # SSRF防御の有効
  # プロキシ環境など自身でDNS解決ができない場合は false へ変更
  # falseへ変更する際、合わせてプロキシ側での内部宛て遮断などSSRFへの防御を組み込んでください
  # ssrf_protection_enabled: true

  # 庁内など IP アドレス指定によるクローリングを有効にする場合 true に設定してください。
  # ssrf_allow_ip_addresses: false

  # SSRF許可リスト
  # 庁内など IP アドレス指定によるクローリングを有効にする場合、ssrf_allow_list への追加も必要です。
  # ssrf_allow_ip_addresses を true へ変更し、ssrf_allow_list へ IP アドレスを追加してください。
  # ssrf_allow_list: []

  # SSRF拒否リスト
  # ssrf_deny_list: []

test:
  <<: *production
  fuseki:
    disable: true
  ssrf_allow_list:
    - '10.11.102.0/24'

development:
  <<: *production
