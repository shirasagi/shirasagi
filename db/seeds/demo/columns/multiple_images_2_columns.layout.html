{% if value.items.size > 0 %}
{{ value.header }}
  <div class="column2">
    {% for item in value.items %}
      <div class="column-item">
        {% if item.file.image? %}
          <img src="{{ item.file.url }}" alt="{{ item.label }}">
        {% else %}
          <a href="{{ item.file.url }}">{{ item.label }}</a>
        {% endif %}
      </div>
    {% endfor %}
  </div>
{% endif %}
